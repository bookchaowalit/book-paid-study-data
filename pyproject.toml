[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-paid-study-data"
version = "0.1.0"
description = "Find compensated participation with screening, time and privacy terms."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-paid-study-data = "book_paid_study_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_paid_study_data = ["*.json"]
