name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline; network is never used)
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          book-paid-study-data contract > /dev/null
          book-paid-study-data validate src/book_paid_study_data/demo.json
          book-paid-study-data demo --open-only > /dev/null
